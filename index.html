    <script>
        const clarityConsentKey = 'trilince_cookie_consent';
        const sendClarityConsent = (adStorage, analyticsStorage) => {
            window.clarity('consentv2', {
                ad_Storage: adStorage,
                analytics_Storage: analyticsStorage
            });
        };

        const setConsent = (value) => {
            localStorage.setItem(clarityConsentKey, value);
            if (value === 'granted') {
                sendClarityConsent('granted', 'granted');
            } else {
                sendClarityConsent('denied', 'denied');
            }
        };

        const loadStoredConsent = () => {
            const existing = localStorage.getItem(clarityConsentKey);
            if (existing === 'granted') {
                sendClarityConsent('granted', 'granted');
            } else if (existing === 'denied') {
                sendClarityConsent('denied', 'denied');
            } else {
                // Default to privacy-preserving no-consent mode until the user chooses.
                sendClarityConsent('denied', 'denied');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadStoredConsent();
            const banner = document.getElementById('cookie-banner');
            const acceptBtn = document.getElementById('cookie-accept');
            const rejectBtn = document.getElementById('cookie-reject');

            if (!localStorage.getItem(clarityConsentKey) && banner) {
                banner.classList.add('visible');
            }

            acceptBtn?.addEventListener('click', () => {
                setConsent('granted');
                banner?.classList.remove('visible');
            });

            rejectBtn?.addEventListener('click', () => {
                setConsent('denied');
                banner?.classList.remove('visible');
            });
        });
    </script>

  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      rgba(16,53,60,0.50) 0%,
      rgba(16,53,60,0.18) 60%,
      transparent 100%
    );
  }

  /* Top-left: Coming soon + symbol inline as punctuation */
  .top-left {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 10;
    padding: clamp(40px, 7vw, 100px);
  }

  .headline {
    display: flex;
    align-items: baseline;
    gap: clamp(8px, 1.2vw, 18px);
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
  }

  .coming-soon {
    font-family: 'Cardo', Georgia, serif;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(42px, 7vw, 96px);
    line-height: 1;
    color: #EDEBE3;
    white-space: nowrap;
  }

  /* Symbol — sits on the text baseline (bottom of "n", not descenders) */
  .symbol {
    position: relative;
    bottom: clamp(-4px, -0.3vw, -2px);
  }

  .symbol svg {
    width: clamp(28px, 3.8vw, 52px);
    height: auto;
    display: block;
  }

  .stone-1, .stone-2, .stone-3 { fill: #EDEBE3; }
  .stone-1 { animation: pulse 3s ease-in-out 0s infinite; }
  .stone-2 { animation: pulse 3s ease-in-out 1s infinite; }
  .stone-3 { animation: pulse 3s ease-in-out 2s infinite; }

  @keyframes pulse {
    0%   { fill: #EC3A27; }
    28%  { fill: #EC3A27; }
    48%  { fill: #EDEBE3; }
    100% { fill: #EDEBE3; }
  }

  /* Bottom-right: easter egg quote */
  .bottom-right {
    position: absolute;
    bottom: clamp(140px, 22vw, 280px);
    right: clamp(24px, 4vw, 64px);
    z-index: 10;
    text-align: right;
    opacity: 0;
    animation: fadeIn 2s ease-out 2s forwards;
  }

  .bottom-right .line-1 {
    font-family: 'Cardo', Georgia, serif;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(13px, 1.8vw, 16px);
    line-height: 1.6;
    color: #EDEBE3;
    opacity: 0.38;
    display: block;
  }

  .bottom-right .line-2 {
    font-family: 'Cardo', Georgia, serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(13px, 1.8vw, 16px);
    line-height: 1.6;
    color: #EDEBE3;
    opacity: 0.38;
    display: block;
  }

  .bottom-right .edot {
    color: #EC3A27;
    font-style: normal;
    opacity: 1;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
</style>
</head>
