    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trilince</title>
    <meta name="description" content="Trilince is a company focused on Dynamics 365 CE implementations">
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "wdr7llv55b");
    </script>
    <script>
        const clarityConsentKey = 'trilince_cookie_consent';
        const sendClarityConsent = (adStorage, analyticsStorage) => {
            window.clarity('consentv2', {
                ad_Storage: adStorage,
                analytics_Storage: analyticsStorage
            });
        };

        const setConsent = (value) => {
            localStorage.setItem(clarityConsentKey, value);
            if (value === 'granted') {
                sendClarityConsent('granted', 'granted');
            } else {
                sendClarityConsent('denied', 'denied');
            }
        };

        const loadStoredConsent = () => {
            const existing = localStorage.getItem(clarityConsentKey);
            if (existing === 'granted') {
                sendClarityConsent('granted', 'granted');
            } else if (existing === 'denied') {
                sendClarityConsent('denied', 'denied');
            } else {
                // Default to privacy-preserving no-consent mode until the user chooses.
                sendClarityConsent('denied', 'denied');
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadStoredConsent();
            const banner = document.getElementById('cookie-banner');
            const acceptBtn = document.getElementById('cookie-accept');
            const rejectBtn = document.getElementById('cookie-reject');

            if (!localStorage.getItem(clarityConsentKey) && banner) {
                banner.classList.add('visible');
            }

            acceptBtn?.addEventListener('click', () => {
                setConsent('granted');
                banner?.classList.remove('visible');
            });

            rejectBtn?.addEventListener('click', () => {
                setConsent('denied');
                banner?.classList.remove('visible');
            });
        });
    </script>
    <style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: #10353C;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
 
  .symbol-wrap {
    width: min(260px, 60vw);
  }
 
  .symbol-wrap svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }
 
  /* Base state: all stones are Clear (#EDEBE3) */
  .stone {
    fill: #EDEBE3;
    transition: fill 0.6s ease;
  }
 
  /* Signal red */
  .stone.active {
    fill: #EC3A27;
  }
 
  /*
    Three stones, staggered animation.
    Each stone cycles through: active (red) → rest (cream) → rest (cream) → repeat
    Phase offsets ensure only one is red at a time, with a smooth handoff.
 
    Duration per full cycle: 3s
    Each stone is red for 1s, cream for 2s
    Offsets: stone1=0s, stone2=1s, stone3=2s
  */
 
  .stone-1 {
    animation: pulse 3s ease-in-out 0s infinite;
  }
  .stone-2 {
    animation: pulse 3s ease-in-out 1s infinite;
  }
  .stone-3 {
    animation: pulse 3s ease-in-out 2s infinite;
  }
 
  @keyframes pulse {
    0%   { fill: #EC3A27; }
    28%  { fill: #EC3A27; }
    48%  { fill: #EDEBE3; }
    100% { fill: #EDEBE3; }
  }
 
</style>
